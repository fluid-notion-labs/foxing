[package]
name = "foxingd"
version = "0.5.2"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Joel Wirāmu Pauling <aenertia@aenertia.net>"]
repository = "https://codeberg.org/aenertia/foxing"
description = "Foxing: eBPF-powered filesystem replication daemon with adaptive tuning and versioning"

[features]
debug_metrics = ["fxcp-core/debug_metrics"]

[lib]
name = "foxingd"
path = "src/lib.rs"

[[bin]]
name = "foxingd"
path = "src/main.rs"

[dependencies]
fxcp-core = { path = "../fxcp-core" }
tokio = { version = "1.48.0", features = ["full", "signal", "time", "fs"] }
tokio-util = "0.7.17"
futures = "0.3.31"
libbpf-rs = "0.26.0-beta.1"
libbpf-sys = "1.5.1"
nix = { version = "0.27.1", features = ["fs", "mount", "signal", "process", "user", "ioctl", "sched"] }
libc = "0.2.177"
io-uring = "0.7.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"
clap = { version = "4.5.53", features = ["derive"] }
regex = "1.12.2"
anyhow = "1.0.100"
thiserror = "1.0.69"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
parking_lot = "0.12.5"
dashmap = { version = "5.5.3", features = ["rayon"] }
lazy_static = "1.5.0"
lru = "0.14.0"
prometheus = { version = "0.13.4", features = ["process"] }
axum = "0.7.9"
sysinfo = "0.37.2"
xattr = "1.6.1"
walkdir = "2.5.0"
chrono = { version = "0.4.42", features = ["serde"] }
glob = "0.3.3"
fxhash = "0.2.1"
reqwest = { version = "0.11.27", features = ["blocking", "json"] }
comfy-table = "7.2.1"
uuid = { version = "1.18.1", features = ["v4"] }
notify = "6.1.1"
ratatui = "0.26.3"
crossterm = { version = "0.27.0", features = ["event-stream"] }
hex = "0.4.3"
tower-http = { version = "0.6.7", features = ["trace"] }
rayon = "1.11.0"
crossbeam = "0.8.4"
rand = "0.9.2"
blake3 = "1.8.2"
bincode = "1.3.3"

[build-dependencies]
libbpf-cargo = "0.26.0-beta.1"
