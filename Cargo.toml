[package]
name = "foxing"
version = "0.1.0"
edition = "2024"
description = "Foxing: High-performance, eBPF-powered filesystem replication daemon with adaptive tuning and versioning."

[lib]
name = "foxing"
path = "src/lib.rs"

[[bin]]
name = "foxing"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.48.0", features = ["full", "signal", "time", "fs"] }
tokio-util = "0.7.17"
futures = "0.3.31"
libbpf-rs = "0.25.0"
libbpf-sys = "1.5.1"
nix = { version = "0.27.1", features = ["fs", "mount", "signal", "process", "user", "ioctl", "sched"] }
libc = "0.2.177"
io-uring = "0.7.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"
clap = { version = "4.5.53", features = ["derive"] }
regex = "1.12.2"
anyhow = "1.0.100"
thiserror = "1.0.69"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
parking_lot = "0.12.5"
dashmap = "5.5.3"
lazy_static = "1.5.0"
lru = "0.14.0"
prometheus = { version = "0.13.4", features = ["process"] }
axum = "0.7.9"
sysinfo = "0.30.13"
xattr = "1.6.1"
walkdir = "2.5.0"
chrono = { version = "0.4.42", features = ["serde"] }
glob = "0.3.3"
fxhash = "0.2.1"
reqwest = { version = "0.11.27", features = ["blocking", "json"] }
comfy-table = "7.2.1"
uuid = { version = "1.18.1", features = ["v4"] }
notify = "6.1.1" 
ratatui = "0.26.3"
crossterm = "0.27.0"
hex = "0.4.3"
tower-http = { version = "0.6.7", features = ["trace"] }
rayon = "1.11.0"

[build-dependencies]
libbpf-cargo = "0.25.0"

[profile.dev]
opt-level = 0
debug = true
lto = false

[profile.release]
opt-level = 3
debug = true  # Include debug info in release builds for profiling/debugging symbols
strip = false
