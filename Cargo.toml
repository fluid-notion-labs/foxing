[package]
name = "foxing"
version = "0.3.2"
edition = "2024"
description = "Foxing: High-performance, eBPF-powered filesystem replication daemon with adaptive tuning and versioning."

[lib]
name = "foxing"
path = "src/lib.rs"

[[bin]]
name = "foxing"
path = "src/main.rs"

[features]
debug_metrics = []

[dependencies]
# Downgraded from 1.50.0 to 1.48.0 to match original context
tokio = { version = "1.48.0", features = ["full", "signal", "time", "fs"] }
tokio-util = "0.7.17"
futures = "0.3.31"
# Explicitly use the beta version as 0.26.0 stable is not yet available
libbpf-rs = "0.26.0-beta.1"
libbpf-sys = "1.5.1"
nix = { version = "0.27.1", features = ["fs", "mount", "signal", "process", "user", "ioctl", "sched"] }
libc = "0.2.177"
io-uring = "0.7.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"
clap = { version = "4.5.53", features = ["derive"] }
regex = "1.12.2"
anyhow = "1.0.100"
thiserror = "1.0.69"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
parking_lot = "0.12.5"
# Enabled rayon feature for parallel iteration support
dashmap = { version = "5.5.3", features = ["rayon"] }
lazy_static = "1.5.0"
lru = "0.14.0"
prometheus = { version = "0.13.4", features = ["process"] }
axum = "0.7.9"
sysinfo = "0.37.2"
xattr = "1.6.1"
walkdir = "2.5.0"
chrono = { version = "0.4.42", features = ["serde"] }
glob = "0.3.3"
fxhash = "0.2.1"
reqwest = { version = "0.11.27", features = ["blocking", "json"] }
comfy-table = "7.2.1"
uuid = { version = "1.18.1", features = ["v4"] }
notify = "6.1.1"
ratatui = "0.26.3"
# Added event-stream feature
crossterm = { version = "0.27.0", features = ["event-stream"] }
hex = "0.4.3"
tower-http = { version = "0.6.7", features = ["trace"] }
rayon = "1.11.0"
crossbeam = "0.8.4"
# FIX: Updating rand to user-requested version 0.9.2
rand = "0.9.2"
# Added for content-aware verification
blake3 = "1.8.2"
# Added for metadata serialization
bincode = "1.3.3"

[build-dependencies]
# Match the build dependency version to the runtime library
libbpf-cargo = "0.26.0-beta.1"

[profile.dev]
opt-level = 0
debug = true
lto = false

# --- Task 3: Configurable Lints ---
[profile.dev.lints]
# Enable the restriction category generally
restriction = "warn"
# Allow common, sensible exceptions
allow = [
    "clippy::expect_used",
    "clippy::panic",
    "clippy::print_stdout",
    "clippy::arithmetic_side_effects", # Too strict for systems code
    "clippy::integer_division",
    "clippy::default_numeric_fields", # Used in some complex library structs
    "clippy::as_conversions",
    "clippy::shadow_reuse",
    "clippy::shadow_unrelated",
]
# Ensure the new safety lint is enabled
deny = [
    "unsafe_op_in_unsafe_fn",
]

[profile.release]
opt-level = 3
debug = true
strip = false
