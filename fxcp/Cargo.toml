[package]
name = "fxcp"
version = "0.4.0"
edition = "2024"
description = "Smart filesystem copy — rsync replacement with CoW/reflink support"

[[bin]]
name = "fxcp"
path = "src/main.rs"

[dependencies]
fxcp-core = { path = "../fxcp-core" }
clap = { version = "4.5.53", features = ["derive"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs", "sync", "signal"] }
walkdir = "2.5.0"
comfy-table = "7.2.1"
io-uring = "0.7.11"
libc = "0.2.177"
nix = { version = "0.27.1", features = ["fs"] }
glob = "0.3.3"
chrono = { version = "0.4.42", features = ["serde"] }
zstd = "0.13"
lz4_flex = "0.11"
flate2 = "1.1"
