[package]
name = "fxcp-core"
version = "0.7.1"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Joel Wirāmu Pauling <aenertia@aenertia.net>"]
repository = "https://codeberg.org/aenertia/foxing"
description = "Core copy engine for foxing — smart filesystem copy with CoW/reflink/io_uring support"

[features]
default = ["nfs-bypass"]
debug_metrics = []
nfs-bypass = []

[dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs", "sync", "signal", "time", "net"] }
futures = "0.3.31"
nix = { version = "0.27.1", features = ["fs", "mount", "signal", "process", "user", "ioctl", "sched"] }
libc = "0.2.177"
io-uring = "0.7.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"
regex = "1.12.2"
anyhow = "1.0.100"
thiserror = "1.0.69"
tracing = "0.1.43"
parking_lot = "0.12.5"
dashmap = { version = "5.5.3", features = ["rayon"] }
lazy_static = "1.5.0"
prometheus = { version = "0.13.4", features = ["process"] }
sysinfo = "0.37.2"
xattr = "1.6.1"
walkdir = "2.5.0"
glob = "0.3.3"
fxhash = "0.2.1"
uuid = { version = "1.18.1", features = ["v4"] }
hex = "0.4.3"
rayon = "1.11.0"
crossbeam = "0.8.4"
blake3 = "1.8.2"
bincode = "1.3.3"
chrono = { version = "0.4.42", features = ["serde"] }
comfy-table = "7.2.1"
zstd = "0.13"
lz4_flex = "0.11"
flate2 = "1.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
clap = { version = "4.5.53", features = ["derive"] }
pathdiff = "0.2"

[dev-dependencies]
tempfile = "3"
